name: Generate Global Binaries

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Purpose of this build run'
        type: choice
        required: true
        default: 'test'
        options:
          - 'test'
          - 'release'

permissions:
  contents: write

# =========================================================================
# CHANGE THIS SINGLE VARIABLE TO DEPLOY THIS WORKFLOW TO ANOTHER REPOSITORY
# =========================================================================
env:
  PROJECT_NAME: v32opt

jobs:
  build:
    name: Build (${{ matrix.os }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os-runner }}

    # The OpenBSD and Haiku targets are a nice extra, not a requirement:
    # if one of them fails, the job still counts as passed, so the release
    # job below goes ahead with every package that did build.
    continue-on-error: ${{ matrix.optional == true }}

    defaults:
      run:
        shell: ${{ matrix.os == 'windows' && 'msys2 {0}' || 'bash' }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows Targets
          #   x86_64: MSYS2 UCRT64 (gcc) on the regular x64 runner.
          #   arm64:  MSYS2 CLANGARM64 (clang) on GitHub's native Windows
          #           ARM64 runner. Cross-compiling from the x64 runner
          #           can't work: UCRT64 ships no aarch64 C runtime or
          #           import libraries to link against, which is why the
          #           old "clang -target aarch64-w64-windows-gnu" build
          #           failed. (windows-11-arm is free for public
          #           repositories.)
          - os: windows
            arch: x86_64
            os-runner: windows-latest
            msystem: UCRT64
            msys-packages: mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-make zip
          - os: windows
            arch: arm64
            os-runner: windows-11-arm
            msystem: CLANGARM64
            msys-packages: mingw-w64-clang-aarch64-clang make zip

          # macOS Targets
          - os: macos
            arch: x86_64
            os-runner: macos-latest
          - os: macos
            arch: arm64
            os-runner: macos-latest

          # Linux Core Targets
          - os: linux
            arch: x86_64
            os-runner: ubuntu-latest
          - os: linux
            arch: arm64
            os-runner: ubuntu-latest

          # Linux Raspberry Pi Targets
          - os: linux
            arch: armv7-rpi
            os-runner: ubuntu-latest
          - os: linux
            arch: armv8-rpi
            os-runner: ubuntu-latest

          # OpenBSD and Haiku Targets (optional): built inside a QEMU
          # virtual machine on a Linux runner by cross-platform-actions.
          # The arm64 OpenBSD guest is emulated, so it is the slowest job.
          - os: openbsd
            arch: x86_64
            os-runner: ubuntu-latest
            vm-arch: x86-64
            vm-version: '7.9'
            optional: true
          - os: openbsd
            arch: arm64
            os-runner: ubuntu-latest
            vm-arch: arm64
            vm-version: '7.9'
            optional: true
          - os: haiku
            arch: x86_64
            os-runner: ubuntu-latest
            vm-arch: x86-64
            vm-version: 'r1beta5'
            optional: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- ENVIRONMENT TOOLCHAIN SETUP ---
      - name: Setup MSYS2 Toolchain (Windows)
        if: matrix.os == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.msys-packages }}
      - name: Setup Linux ARM Cross-Compilers
        if: matrix.os == 'linux'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ] || [ "${{ matrix.arch }}" = "armv8-rpi" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-aarch64-linux-gnu
          elif [ "${{ matrix.arch }}" = "armv7-rpi" ]; then
            sudo apt-get update && sudo apt-get install -y gcc-arm-linux-gnueabihf
          fi
      - name: Start Virtual Machine (OpenBSD / Haiku)
        if: matrix.os == 'openbsd' || matrix.os == 'haiku'
        uses: cross-platform-actions/action@v1.4.0
        with:
          operating_system: ${{ matrix.os }}
          architecture: ${{ matrix.vm-arch }}
          version: ${{ matrix.vm-version }}

      # --- BUILD EXECUTABLES & STRIP SYMBOLS ---
      - name: Compile and Strip (Windows)
        if: matrix.os == 'windows'
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            make CC="clang"
            llvm-strip bin/*
          else
            mingw32-make CC="gcc"
            strip bin/*
          fi
      - name: Compile and Strip (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: |
          make CC="clang -arch ${{ matrix.arch }}"
          strip bin/*
      - name: Compile and Strip (Linux)
        if: matrix.os == 'linux'
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ] || [ "${{ matrix.arch }}" = "armv8-rpi" ]; then
            make CC="aarch64-linux-gnu-gcc"
            aarch64-linux-gnu-strip bin/*
          elif [ "${{ matrix.arch }}" = "armv7-rpi" ]; then
            make CC="arm-linux-gnueabihf-gcc"
            arm-linux-gnueabihf-strip bin/*
          else
            make CC="gcc"
            strip bin/*
          fi
      # Runs inside the VM (the checkout is synced in, and bin/ back out).
      # The project Makefiles need GNU make, which OpenBSD doesn't ship
      # (its make is BSD make; gmake is a package), so the sources are
      # compiled directly, with the same flags src/Makefile uses. The
      # code needs nothing from libm, so no -lm (Haiku keeps it in libroot).
      - name: Compile and Strip (OpenBSD / Haiku)
        if: matrix.os == 'openbsd' || matrix.os == 'haiku'
        shell: cpa.sh {0}
        run: |
          uname -a
          if command -v cc >/dev/null 2>&1; then CC=cc; else CC=gcc; fi
          mkdir -p bin
          $CC -Wall -Wextra -O2 -Isrc -Iinc src/*.c src/peephole/*.c -o bin/${{ env.PROJECT_NAME }}
          strip bin/*
          ./bin/${{ env.PROJECT_NAME }} --version

      # --- MODULAR PACKAGING BLOCK (ALL OS RUNNERS) ---
      # (Default shell: MSYS2's bash on Windows, which has the zip package
      # installed above; Git Bash, the runner's own "bash", has no zip.)
      - name: Parse Version and Create Zip Archive
        run: |
          # Dynamically builds path: inc/${PROJECT_NAME}.h
          HEADER_FILE="inc/${{ env.PROJECT_NAME }}.h"

          # The '#define VERSION "..."' line itself (comments above it
          # mention VERSION too, so a plain grep picks up the wrong line).
          VERSION=$(sed -n 's/^#define[[:space:]]*VERSION[[:space:]]*"\(.*\)".*/\1/p' "$HEADER_FILE" | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error::could not read VERSION from $HEADER_FILE"
            exit 1
          fi

          if [ "${{ github.event.inputs.build_type }}" = "test" ]; then
            ZIP_NAME="${{ env.PROJECT_NAME }}-${VERSION}-test-${{ matrix.os }}-${{ matrix.arch }}.zip"
            echo "RETENTION_DAYS=2" >> $GITHUB_ENV
          else
            ZIP_NAME="${{ env.PROJECT_NAME }}-${VERSION}-${{ matrix.os }}-${{ matrix.arch }}.zip"
            echo "RETENTION_DAYS=0" >> $GITHUB_ENV
          fi

          echo "VERSION_TAG=v$VERSION" >> $GITHUB_ENV
          echo "Packaging: $ZIP_NAME"

          # The READMEs and manual pages, in every language present
          cp README*.md bin/
          cp man/*.1 bin/ 2>/dev/null || true
          cd bin
          zip -r "../$ZIP_NAME" ./*
          cd ..

          echo "FINAL_ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV
      # --- STAGE ZIP INTERNALLY ---
      - name: Upload Compressed Target Release Artifact
        uses: actions/upload-artifact@v4
        with:
          # Modified to avoid naming collisions across jobs
          name: ${{ env.PROJECT_NAME }}-package-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ env.FINAL_ZIP_NAME }}
          retention-days: ${{ fromJson(env.RETENTION_DAYS) }}

      - name: Save Version Tag for Release Job
        run: echo "${{ env.VERSION_TAG }}" > version_tag.txt

      - name: Upload Version Tag
        uses: actions/upload-artifact@v4
        with:
          name: version-tag-${{ matrix.os }}-${{ matrix.arch }}
          path: version_tag.txt
          retention-days: ${{ fromJson(env.RETENTION_DAYS) }}

  release:
    name: Create Draft Release
    needs: build
    if: github.event.inputs.build_type == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Download all zip packages from build jobs
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Determine Version Tag
        run: |
          VERSION_TAG=$(cat artifacts/version_tag.txt | head -n 1)
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_ENV
          rm artifacts/version_tag.txt
      - name: Generate Draft Release on GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_TAG }}
          name: "${{ env.PROJECT_NAME }} Release ${{ env.VERSION_TAG }}"
          draft: true
          prerelease: false
          files: artifacts/*.zip
